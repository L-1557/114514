<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - 涉水审批系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            color: #667eea;
            font-size: 36px;
            font-weight: bold;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e8eaff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .results {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .result-item {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        
        .result-item h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .result-item .meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }
        
        .result-item .text {
            color: #333;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9ff;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        .file-item .name {
            color: #333;
            font-size: 14px;
        }
        
        .file-item .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .file-item .delete-btn:hover {
            background: #cc0000;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .checklist {
            margin-top: 20px;
        }
        
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9ff;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        
        .checklist-item .icon {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .checklist-item.success {
            border-left: 3px solid #28a745;
        }
        
        .checklist-item.error {
            border-left: 3px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📚 知识库管理</h1>
            <p>上传、管理和检索涉水审批相关法规、政策、办事指南等知识文档</p>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>文档总数</h3>
                <div class="value" id="total-docs">0</div>
            </div>
            <div class="stat-card">
                <h3>来源文件</h3>
                <div class="value" id="total-sources">0</div>
            </div>
            <div class="stat-card">
                <h3>服务状态</h3>
                <div class="value" style="font-size: 20px;" id="service-status">检查中...</div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-grid">
            <!-- 左侧：上传和管理 -->
            <div>
                <div class="card">
                    <h2>📤 上传文档</h2>
                    
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon">📄</div>
                        <p>点击或拖拽文件到此处上传</p>
                        <p style="color: #999; font-size: 14px; margin-top: 10px;">支持 PDF 和 Word 格式</p>
                    </div>
                    
                    <input type="file" id="file-input" accept=".pdf,.doc,.docx" style="display: none;">
                    
                    <div class="progress-bar" id="progress-bar" style="display: none;">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    
                    <div id="upload-status"></div>
                    
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: #667eea;">已上传文件</h3>
                    <div class="file-list" id="file-list">
                        <p style="color: #999; text-align: center; padding: 20px;">暂无文件</p>
                    </div>
                </div>
            </div>
            
            <!-- 右侧：检索 -->
            <div>
                <div class="card">
                    <h2>🔍 知识检索</h2>
                    
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="输入查询内容，例如：取水许可申请需要什么材料？">
                        <button onclick="searchKnowledge()">搜索</button>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: flex; align-items: center; gap: 10px; color: #666;">
                            返回结果数：
                            <input type="number" id="top-k" value="5" min="1" max="20" style="width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px;">
                        </label>
                    </div>
                    
                    <div class="results" id="search-results">
                        <p style="color: #999; text-align: center; padding: 40px;">输入查询内容开始搜索</p>
                    </div>
                </div>
                
                <!-- 材料检查 -->
                <div class="card" style="margin-top: 30px;">
                    <h2>✅ 材料完整性检查</h2>
                    
                    <div style="margin-bottom: 15px;">
                        <p style="color: #666; font-size: 14px; margin-bottom: 10px;">输入已提交的材料（用逗号分隔）：</p>
                        <textarea id="checklist-input" rows="4" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; resize: vertical;" placeholder="例如：申请书，身份证明，水资源论证报告"></textarea>
                    </div>
                    
                    <button class="btn" onclick="checkCompleteness()">检查材料完整性</button>
                    
                    <div id="checklist-result" class="checklist"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8003/api';
        
        // 页面加载时检查服务状态和统计信息
        window.onload = async function() {
            await checkServiceStatus();
            await loadStats();
        };
        
        // 检查服务状态
        async function checkServiceStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                document.getElementById('service-status').textContent = '✅ 运行中';
                document.getElementById('service-status').style.color = '#28a745';
            } catch (error) {
                document.getElementById('service-status').textContent = '❌ 未启动';
                document.getElementById('service-status').style.color = '#dc3545';
                showStatus('upload-status', '服务未启动，请先启动 Python AI 服务', 'error');
            }
        }
        
        // 加载统计信息
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/knowledge/stats`);
                const data = await response.json();
                
                document.getElementById('total-docs').textContent = data.stats.total_documents;
                document.getElementById('total-sources').textContent = data.sources.length;
                
                // 更新文件列表
                updateFileList(data.sources);
            } catch (error) {
                console.error('加载统计信息失败:', error);
            }
        }
        
        // 更新文件列表
        function updateFileList(sources) {
            const fileList = document.getElementById('file-list');
            
            if (sources.length === 0) {
                fileList.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无文件</p>';
                return;
            }
            
            fileList.innerHTML = '';
            sources.forEach(source => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span class="name">📄 ${source}</span>
                    <button class="delete-btn" onclick="deleteDocument('${source}')">删除</button>
                `;
                fileList.appendChild(fileItem);
            });
        }
        
        // 上传区域交互
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadFile(fileInput.files[0]);
            }
        });
        
        // 上传文件
        async function uploadFile(file) {
            // 验证文件类型
            const validTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            if (!validTypes.includes(file.type)) {
                showStatus('upload-status', '不支持的文件格式，请上传 PDF 或 Word 文档', 'error');
                return;
            }
            
            // 显示进度条
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-fill').style.width = '30%';
            
            try {
                // 创建 FormData
                const formData = new FormData();
                formData.append('file', file);
                
                // 上传到服务器（这里简化处理，实际应该先上传到 Java 后端）
                // 为了演示，我们假设文件已经在服务器上
                showStatus('upload-status', `正在解析：${file.name}`, 'info');
                document.getElementById('progress-fill').style.width = '60%';
                
                // 模拟上传延迟
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // 实际应该调用后端 API
                // 这里仅做演示
                showStatus('upload-status', '演示模式：文件上传成功（实际使用需连接后端）', 'success');
                document.getElementById('progress-fill').style.width = '100%';
                
                setTimeout(() => {
                    document.getElementById('progress-bar').style.display = 'none';
                    loadStats();
                }, 2000);
                
            } catch (error) {
                showStatus('upload-status', `上传失败：${error.message}`, 'error');
                document.getElementById('progress-bar').style.display = 'none';
            }
        }
        
        // 删除文档
        async function deleteDocument(source) {
            if (!confirm(`确定要删除文档"${source}"吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/knowledge/delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ source: source })
                });
                
                const data = await response.json();
                
                if (data.deleted > 0) {
                    showStatus('upload-status', `已删除文档：${source}`, 'success');
                    loadStats();
                } else {
                    showStatus('upload-status', '删除失败', 'error');
                }
            } catch (error) {
                showStatus('upload-status', `删除失败：${error.message}`, 'error');
            }
        }
        
        // 知识检索
        async function searchKnowledge() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                alert('请输入查询内容');
                return;
            }
            
            const topK = parseInt(document.getElementById('top-k').value) || 5;
            
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '<p style="text-align: center; padding: 40px; color: #667eea;">🔍 正在搜索...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/knowledge/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: topK,
                        min_similarity: 0.5
                    })
                });
                
                const data = await response.json();
                
                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">未找到相关结果</p>';
                    return;
                }
                
                let html = '';
                data.results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <h4>📊 相似度：${(result.similarity * 100).toFixed(1)}%</h4>
                            <div class="meta">
                                📄 来源：${result.source}
                                ${result.page ? ` | 第${result.page}页` : ''}
                            </div>
                            <div class="text">${highlightText(result.text, query)}</div>
                        </div>
                    `;
                });
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<p style="text-align: center; padding: 40px; color: #dc3545;">搜索失败：${error.message}</p>`;
            }
        }
        
        // 高亮关键词
        function highlightText(text, query) {
            const keywords = query.split(/[,\s]+/).filter(k => k.length > 0);
            let highlighted = text;
            
            keywords.forEach(keyword => {
                const regex = new RegExp(`(${keyword})`, 'gi');
                highlighted = highlighted.replace(regex, '<mark style="background: yellow;">$1</mark>');
            });
            
            return highlighted;
        }
        
        // 检查材料完整性
        async function checkCompleteness() {
            const input = document.getElementById('checklist-input').value.trim();
            if (!input) {
                alert('请输入已提交的材料');
                return;
            }
            
            const documents = input.split(/[,,\n]/).map(s => s.trim()).filter(s => s);
            
            const resultDiv = document.getElementById('checklist-result');
            resultDiv.innerHTML = '<p style="text-align: center; padding: 20px; color: #667eea;">⏳ 正在检查...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/knowledge/check`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        submitted_documents: documents
                    })
                });
                
                const data = await response.json();
                
                let html = '<h4 style="margin-bottom: 15px; color: #667eea;">检查结果</h4>';
                
                // 已具备材料
                if (data.provided && data.provided.length > 0) {
                    data.provided.forEach(doc => {
                        html += `
                            <div class="checklist-item success">
                                <span class="icon">✅</span>
                                <span>${doc}</span>
                            </div>
                        `;
                    });
                }
                
                // 缺失材料
                if (data.missing && data.missing.length > 0) {
                    data.missing.forEach(doc => {
                        html += `
                            <div class="checklist-item error">
                                <span class="icon">❌</span>
                                <span>${doc}</span>
                            </div>
                        `;
                    });
                }
                
                // 完整度
                html += `<p style="margin-top: 15px; font-weight: bold; color: #667eea;">完整度：${data.completeness || 0}%</p>`;
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="text-align: center; padding: 20px; color: #dc3545;">检查失败：${error.message}</p>`;
            }
        }
        
        // 显示状态消息
        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
            
            if (type === 'success') {
                setTimeout(() => {
                    element.innerHTML = '';
                }, 5000);
            }
        }
        
        // 回车搜索
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchKnowledge();
            }
        });
    </script>
</body>
</html>
